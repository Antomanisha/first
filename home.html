
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf2ff;
            text-align: center;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 15px #ccc;
        }
        h1 { color: #2563eb; }
        h2 { color: #444; }
        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello, I'm a Student!</h1>
        <p>Welcome to my personal portfolio.</p>

        <h2>About Me</h2>
        <p>I am interested in technology, programming
        and innovation.</p>

        <h2>My Skills</h2>
        <p>C | HTML | Java | Problem Solving</p>

        <h2>My Goal</h2>
        <p>To become a successful engineer and developer.</p>

        <button onclick="showMessage()">Contact Me</button>
    </div>

    <script>
        function showMessage() {
            alert("Thank you for visiting my portfolio!");
        }
    </script>
</body>
</html>
